<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profissional</title>
    <style>
        :root {
            --accent: #BFA181;
            --white: #ffffff;
            --muted: #f6f2ef;
            --muted-2: #efe9e2
        }

        * {
            box-sizing: border-box
        }

        html, body {
            height: 100%
        }

        body {
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: linear-gradient(180deg, #fbf9f7 0%, var(--muted) 100%);
            color: #222;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column; /* Garante que os links inferiores fiquem no lugar certo */
            justify-content: start;
            align-items: center
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 1020px;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(15, 20, 25, 0.08);
            padding: 28px;
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 28px;
            align-items: start
        }

        .card-header {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 20px /* Aumentado para dar mais respiro */
        }

        h1 {
            color: var(--accent);
            margin: 0;
            font-size: 1.6rem
        }

        .subtitle {
            color: #6b6b6b;
            font-size: 0.95rem
        }

        /* CORREÇÃO AQUI: O grid agora se aplica ao fieldset para alinhar os inputs corretamente */
        fieldset {
            border: 0;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px
        }

        .full {
            grid-column: 1 / -1
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #444
        }

        input[type=text], input[type=email], input[type=tel], input[type=date], select, textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #efe6dd;
            background: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease /* Suaviza o foco */
        }

        input:focus, textarea:focus, select:focus {
            box-shadow: 0 0 0 4px rgba(191, 161, 129, 0.08);
            border-color: var(--accent)
        }

        textarea {
            resize: vertical;
            min-height: 120px
        }

        .radios {
            display: flex;
            flex-direction: column; /* Alinha o título acima das opções */
            gap: 8px;
            justify-content: center
        }

        .radio-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap /* Não quebra em telas pequenas */
        }

        .radios label {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            background: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid #efe6dd;
            cursor: pointer
        }

        .submit-btn {
            grid-column: 1 / -1;
            background: var(--accent);
            color: var(--white);
            border: 0;
            padding: 14px 18px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(191, 161, 129, 0.18);
            width: 100%;
            font-size: 1rem;
            margin-top: 10px
        }

        .submit-btn:hover {
            filter: brightness(.96)
        }

        .form-right {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            justify-content: flex-start;
            position: sticky;
            top: 20px
        }

        .preview-img {
            width: 100%;
            max-height: 400px;
            height: auto;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .06);
            border: 1px solid #f0ebe6
        }

        .page-links {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
            width: 100%;
            max-width: 1020px
        }

        .page-links a {
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            border: 1px solid transparent;
            color: #666;
            background: transparent;
            font-weight: 600;
            text-align: center;
            flex: 1; /* Faz os botões dividirem o espaço igualmente no celular */
            max-width: 200px
        }

        .page-links a.primary {
            background: var(--accent);
            color: var(--white);
            border-color: var(--accent)
        }

        .page-links a:hover {
            opacity: .95
        }

        /* --- CONFIGURAÇÕES PARA CELULAR E TABLET --- */
        @media (max-width: 960px) {
            .card {
                grid-template-columns: 1fr 300px;
                gap: 20px;
                padding: 20px
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 16px 12px
            }
            .card {
                grid-template-columns: 1fr; /* Transforma o layout em uma coluna única */
                gap: 24px
            }
            fieldset {
                grid-template-columns: 1fr /* No celular, cada input fica em sua própria linha */
            }
            .form-right {
                order: -1; /* Move a foto/preview para o TOPO no celular, melhorando o visual */
                position: static
            }
            .preview-img {
                max-height: 200px; /* Reduz o tamanho da foto no celular para não ocupar a tela toda */
                object-fit: contain
            }
            .page-links {
                flex-direction: column; /* Botões inferiores ficam um abaixo do outro no celular */
                align-items: center;
                gap: 8px
            }
            .page-links a {
                max-width: 100%;
                width: 100%
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <div>
            <div class="card-header">
                <h1>Cadastro de Profissionais</h1>
                <div class="subtitle">Cadastre-se para fazer parte da nossa equipe.</div>
            </div>

            <form action="/cadastrar" method="POST">
                <fieldset>
                    <div>
                        <label for="nome">Nome completo</label>
                        <input id="nome" name="nome" type="text" placeholder="Nome completo" required>
                    </div>
                    <div>
                        <label for="cpf">CPF</label>
                        <input id="cpf" name="cpf" type="text" maxlength="11" placeholder="CPF" required>
                    </div>
                    <div>
                        <label for="nascimento">Sua data de Nascimento</label>
                        <input id="nascimento" name="nascimento" type="date" required>
                    </div>
                    <div class="radios">
                        <label for="sexo">Informe seu Gênero</label>
                        <div class="radio-group">
                            <label><input type="radio" name="sexo" value="Masculino" required> Masculino</label>
                            <label><input type="radio" name="sexo" value="Feminino"> Feminino</label>
                        </div>
                    </div>
                    <div>
                        <label for="telefone">Telefone</label>
                        <input id="telefone" name="telefone" type="tel" placeholder="Telefone" required>
                    </div>
                    <div>
                        <label for="email">E-mail</label>
                        <input id="email" name="email" type="email" placeholder="E-mail" required>
                    </div>
                    <div>
                        <label for="cidade">Cidade / Bairro</label>
                        <input id="cidade" name="cidade" type="text" placeholder="Cidade / Bairro" required>
                    </div>
                    <div>
                        <label for="cep">CEP</label>
                        <input id="cep" name="cep" type="text" placeholder="CEP" required>
                    </div>

                    <div>
                        <label for="area">Área de atuação</label>
                        <select id="area" name="area" required>
                            <option disabled value="">Selecione sua Área</option>
                            <option>Técnico em Informática</option>
                            <option>Eletricista</option>
                            <option>Refrigeração</option>
                            <option>Pintura</option>
                            <option>Encanador</option>
                            <option>Técnico em Internet/Wi-fi</option>
                            <option>Montador de Móveis</option>
                            <option>Chaveiro</option>
                            <option>Serviços de Limpeza</option>
                        </select>
                    </div>
                    <div>
                        <label for="principal">Profissão Principal</label>
                        <input id="principal" name="princip" type="text" placeholder="Profissão Principal" required>
                    </div>
                    <div>
                        <label for="tempo">Tempo de Experiência</label>
                        <input id="tempo" name="tempo" type="text" placeholder="Tempo de Experiência" required>
                    </div>
                    <div>
                        <label for="formacao">Formação / Cursos</label>
                        <input id="formacao" name="formacao" type="text" placeholder="Formação / Cursos" required>
                    </div>
                    <div class="full">
                        <label for="sugestao">Fale sobre sua experiência</label>
                        <textarea id="sugestao" name="sugestao" rows="6" placeholder="Fale sobre sua experiência" required></textarea>
                    </div>
                    <button class="submit-btn full" type="submit">Cadastrar Profissional</button>
                </fieldset>
            </form>
        </div>

        <aside class="form-right">
            <img class="preview-img" src="LOGOSFUNDO.PNG" alt="preview">
        </aside>
    </div>

    <div class="page-links">
        <a href="site.html">Voltar à tela inicial</a>
        <a class="primary" href="SolicitarServiços.html">Solicitar serviço</a>
    </div>

</body>
</html>
