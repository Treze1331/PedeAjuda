<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Profissional</title>
    <style>
        :root {
            --accent: #E65C00;
            --accent-gradient: linear-gradient(135deg, #FF7A1A 0%, #E65C00 100%);
            --bg-body: #F3EAE0; 
            --white: #ffffff;
            --muted: #F7EFE5;
            --muted-2: #EFE4DA;
            --success: #2E7D32;
            --error: #C62828;
            --dark-text: #231C19;
            --input-border: #D6C7BC;
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
        }

        html, body {
            height: 100%;
        }

        html {
            scroll-behavior: smooth;
            /* --- NOVA REDUÇÃO GLOBAL DE ESCALA (Sincronizado em 65%) --- */
            font-size: 65%;
        }

        body {
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--dark-text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* -------------------------------------------------------------------- */
        /* HEADER ULTRA CLEAN (Ajustado com unidades relativas REM)             */
        /* -------------------------------------------------------------------- */
        header.header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0px 68px; /* Convertido para rem */
            background-color: rgba(252, 249, 245, 0.85); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid rgba(255, 122, 26, 0.15); 
            box-shadow: 0 4px 20px rgba(35, 28, 25, 0.03);
        }

        .header-logo-container {
            display: flex;
            align-items: center;
        }

        .logo {
            width: 13.3rem; /* Convertido para rem para encolher proporcionalmente */
            height: auto;
            display: block;
        }

        .logo:hover {
            transform: scale(1.02);
        }

        .nav-menu {
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }

        .nav-menu a {
            text-decoration: none;
            color: #5C4E48; 
            font-weight: 600;
            font-size: 1.15rem;
            letter-spacing: -0.1px;
            padding: 0.8rem 1.6rem;
            border-radius: 99px;
        }

        .nav-menu a:hover {
            color: #E65C00;
            background-color: rgba(255, 122, 26, 0.08);
        }

        .nav-menu a[href="ProfissionaisDisponiveis.html"] {
            background: var(--accent-gradient);
            color: var(--white);
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(230, 92, 0, 0.15);
        }

        .nav-menu a[href="ProfissionaisDisponiveis.html"]:hover {
            background: linear-gradient(135deg, #FF8F3D 0%, #FF6B00 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(230, 92, 0, 0.3);
        }

        /* -------------------------------------------------------------------- */
        /* CONTAINER PRINCIPAL DO FORMULÁRIO                                    */
        /* -------------------------------------------------------------------- */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: start;
            padding: 5rem 1.6rem;
            width: 100%;
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 66.6rem; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(35, 28, 25, 0.05), 0 4px 12px rgba(35, 28, 25, 0.02);
            border: 1px solid rgba(230, 92, 0, 0.04);
            padding: 4.1rem;
        }

        .card-header {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 3.3rem;
            text-align: center; 
        }

        h1 {
            color: var(--dark-text);
            margin: 0;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        h1::after {
            content: '.';
            color: var(--accent);
        }

        .subtitle {
            color: #6B5E59;
            font-size: 1.25rem;
            font-weight: 400;
        }

        .section-title {
            grid-column: 1 / -1;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dark-text);
            margin: 1.6rem 0 0.4rem 0;
            display: flex;
            align-items: center;
            gap: 1rem;
            letter-spacing: -0.2px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(214, 199, 188, 0.6) 0%, rgba(214, 199, 188, 0) 100%);
        }

        fieldset {
            border: 0;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }

        .full {
            grid-column: 1 / -1;
        }

        label, .label-title {
            display: block;
            font-size: 1rem;
            margin-bottom: 0.6rem;
            color: #5C4E48;
            font-weight: 600;
            letter-spacing: -0.1px;
        }

        input[type=text], input[type=email], input[type=tel], input[type=date], select, textarea {
            width: 100%;
            padding: 1.1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--input-border);
            background: #fff;
            font-size: 1.1rem;
            color: var(--dark-text);
            outline: none;
            font-family: inherit;
        }

        input[type=date] {
            font-family: inherit;
            color: #5c4e48;
        }

        input:focus, textarea:focus, select:focus {
            box-shadow: 0 0 0 4px rgba(255, 122, 26, 0.12);
            border-color: var(--accent);
            background: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 10.8rem;
        }

        .radios {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .radio-group {
            display: flex;
            gap: 1rem;
        }

        .radio-group label {
            flex: 1;
            display: inline-flex;
            gap: 0.8rem;
            align-items: center;
            justify-content: center;
            background: #fff;
            padding: 1.1rem 1.3rem;
            border-radius: 12px;
            border: 1px solid var(--input-border);
            cursor: pointer;
            margin: 0;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .radio-group label:hover {
            background: var(--muted);
            border-color: var(--accent);
        }

        .radio-group label:has(input[type="radio"]:checked) {
            background: rgba(255, 122, 26, 0.06);
            border-color: var(--accent);
            color: #E65C00;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(230, 92, 0, 0.04);
        }

        .radio-group input[type="radio"] {
            accent-color: var(--accent);
            width: 1.3rem;
            height: 1.3rem;
        }

        .submit-btn {
            grid-column: 1 / -1;
            background: var(--accent-gradient);
            color: var(--white);
            border: 0;
            padding: 1.5rem 2.5rem;
            border-radius: 99px; 
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(230, 92, 0, 0.25);
            width: 100%;
            font-size: 1.15rem;
            margin-top: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(230, 92, 0, 0.35);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .page-links {
            display: flex;
            gap: 1.3rem;
            justify-content: center;
            margin-top: 2.9rem;
            width: 100%;
            max-width: 66.6rem;
        }

        .page-links a {
            padding: 1.1rem 2.3rem;
            border-radius: 99px;
            text-decoration: none;
            border: 1px solid rgba(35, 28, 25, 0.1);
            color: #5C4E48;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            font-weight: 600;
            font-size: 1.15rem;
            text-align: center;
            flex: 1;
            box-shadow: 0 4px 12px rgba(35, 28, 25, 0.02);
        }

        .page-links a.primary {
            background: #fff;
            color: var(--accent);
            border: 1px solid rgba(230, 92, 0, 0.3);
        }

        .page-links a:hover {
            transform: translateY(-2px);
            background: #fff;
            border-color: rgba(35, 28, 25, 0.2);
            box-shadow: 0 6px 15px rgba(35, 28, 25, 0.06);
        }

        .page-links a.primary:hover {
            border-color: var(--accent);
            background: rgba(255, 122, 26, 0.04);
            box-shadow: 0 6px 15px rgba(230, 92, 0, 0.08);
        }

        /* RESPONSIVIDADE ADAPTATIVA */
        @media (max-width: 992px) {
            header.header {
                padding: 1.3rem 3.3rem;
            }
        }

        @media (max-width: 768px) {
            header.header {
                padding: 1.1rem 2rem;
                flex-direction: column;
                gap: 1rem;
            }

            .nav-menu {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            
            .nav-menu a {
                padding: 0.6rem 1.1rem;
                font-size: 1.1rem;
            }

            .main-container {
                padding: 2.5rem 1.3rem;
            }
            .card {
                padding: 2.5rem 1.6rem;
                border-radius: 20px;
            }
            fieldset {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .radio-group {
                flex-direction: column;
                gap: 0.8rem;
            }
            .page-links {
                flex-direction: column;
                gap: 1rem;
            }
            .page-links a {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="main-container">
        <div class="card">
            <div class="card-header">
                <h1>Cadastro de Profissionais</h1>
                <div class="subtitle">Faça parte do nosso ecossistema de especialistas de alto padrão.</div>
            </div>

            <form id="formCadastroProfissional">
                <fieldset>
                    <div class="section-title">Dados Pessoais</div>

                    <div>
                        <label for="nome">Nome completo</label>
                        <input id="nome" name="nome" type="text" placeholder="Ex: João Silva" required>
                    </div>
                    <div>
                        <label for="cpf">CPF</label>
                        <input id="cpf" name="cpf" type="text" maxlength="14" placeholder="000.000.000-00" required>
                    </div>
                    <div>
                        <label for="nascimento">Sua data de Nascimento</label>
                        <input id="nascimento" name="nascimento" type="date" required>
                    </div>
                    <div class="radios">
                        <span class="label-title">Informe seu Gênero</span>
                        <div class="radio-group">
                            <label><input type="radio" name="sexo" value="Masculino" required> Masculino</label>
                            <label><input type="radio" name="sexo" value="Feminino"> Feminino</label>
                        </div>
                    </div>
                    <div>
                        <label for="telefone">Telefone</label>
                        <input id="telefone" name="telefone" type="tel" maxlength="15" placeholder="(00) 00000-0000" required>
                    </div>
                    <div>
                        <label for="email">E-mail</label>
                        <input id="email" name="email" type="email" placeholder="exemplo@email.com" required>
                    </div>
                    <div>
                        <label for="cidade">Cidade / Bairro</label>
                        <input id="cidade" name="cidade" type="text" placeholder="Sua cidade" required>
                    </div>
                    <div>
                        <label interpreters="cep">CEP</label>
                        <input id="cep" name="cep" type="text" maxlength="9" placeholder="00000-000" required>
                    </div>

                    <div class="section-title">Atuação Profissional</div>

                    <div>
                        <label for="area">Área de atuação</label>
                        <select id="area" name="area" required>
                            <option disabled selected value="">Selecione sua Área</option>
                            <option value="Técnico em Informática">Técnico em Informática</option>
                            <option value="Eletricista">Eletricista</option>
                            <option value="Refrigeração">Refrigeração</option>
                            <option value="Pintura">Pintura</option>
                            <option value="Encanador">Encanador</option>
                            <option value="Técnico em Internet/Wi-fi">Técnico em Internet/Wi-fi</option>
                            <option value="Montador de Móveis">Montador de Móveis</option>
                            <option value="Chaveiro">Chaveiro</option>
                            <option value="Serviços de Limpeza">Serviços de Limpeza</option>
                        </select>
                    </div>
                    <div>
                        <label for="principal">Profissão Principal</label>
                        <input id="principal" name="princip" type="text" placeholder="Ex: Eletricista Residencial" required>
                    </div>
                    <div>
                        <label for="tempo">Tempo de Experiência</label>
                        <input id="tempo" name="tempo" type="text" placeholder="Ex: 3 anos" required>
                    </div>
                    <div>
                        <label for="formacao">Formação / Cursos</label>
                        <input id="formacao" name="formacao" type="text" placeholder="Ex: Curso Técnico SENAI" required>
                    </div>
                    <div class="full">
                        <label for="sugestao">Fale sobre sua experiência</label>
                        <textarea id="sugestao" name="sugestao" placeholder="Conte um pouco sobre os serviços que você já realizou..." required></textarea>
                    </div>

                    <button class="submit-btn full" type="submit">Cadastrar Profissional</button>
                </fieldset>
            </form>
        </div>

        <div class="page-links">
            <a href="index.html">Voltar à tela inicial</a>
            <a class="primary" href="SolicitarServiços.html">Solicitar um serviço</a>
        </div>
    </div>

<script>
    const aplicarMascara = (input, funcaoMascara) => {
        if(!input) return;
        input.addEventListener('input', (e) => {
            e.target.value = funcaoMascara(e.target.value);
        });
    };

    const mCPF = (value) => {
        return value.replace(/\D/g, '').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    };

    const mTel = (value) => {
        return value.replace(/\D/g, '').replace(/^(\d{2})(\d)/g, '($1) $2').replace(/(\d{5})(\d)/, '$1-$2').substring(0, 15);
    };

    const mCEP = (value) => {
        return value.replace(/\D/g, '').replace(/^(\d{5})(\d)/, '$1-$2');
    };

    aplicarMascara(document.getElementById('cpf'), mCPF);
    aplicarMascara(document.getElementById('telefone'), mTel);
    aplicarMascara(document.getElementById('cep'), mCEP);

    function mostrarAvisoFlutuante(mensagem, corSucesso) {
        const aviso = document.createElement('div');
        aviso.style.position = 'fixed';
        aviso.style.top = '20px';
        aviso.style.left = '50%';
        aviso.style.transform = 'translateX(-50%)';
        aviso.style.backgroundColor = corSucesso ? '#2E7D32' : '#C62828';
        aviso.style.color = '#ffffff';
        aviso.style.padding = '16px 32px';
        aviso.style.borderRadius = '99px';
        aviso.style.fontWeight = '600';
        aviso.style.fontSize = '1.05rem';
        aviso.style.boxShadow = '0 10px 25px rgba(35, 28, 25, 0.2)';
        aviso.style.zIndex = '10000';
        aviso.style.fontFamily = 'system-ui, sans-serif';
        aviso.textContent = mensagem;

        document.body.appendChild(aviso);
        if (!corSucesso) {
            setTimeout(() => { aviso.remove(); }, 4000);
        }
    }

    document.getElementById('formCadastroProfissional').addEventListener('submit', async function(event) {
        event.preventDefault();

        const formData = new FormData(this);
        const dados = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('/api/cadastrar-profissional', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            let resultado = {};
            try { resultado = await response.json(); } catch(e) {}

            if (response.ok) {
                mostrarAvisoFlutuante('🎉 Cadastro realizado com sucesso!', true);
                this.reset();
                setTimeout(() => { window.location.href = 'index.html'; }, 2000);
            } else {
                mostrarAvisoFlutuante('⚠️ Erro: ' + (resultado.erro || 'Falha ao salvar dados.'), false);
            }
        } catch (error) {
            console.error('Erro:', error);
            mostrarAvisoFlutuante('❌ Erro de conexão: O servidor está ligado?', false);
        }
    });
</script>

</body>
</html>
